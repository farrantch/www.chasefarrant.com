name: Restore production release
on:
  workflow_dispatch:
    inputs:
      release:
        description: Archived release ID to restore (from a successful deploy summary)
        required: true
        type: string
permissions:
  contents: read
jobs:
  restore:
    name: Restore and verify production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.chasefarrant.com
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ID: ${{ inputs.release }}
      ARCHIVE_BUCKET: ${{ vars.RELEASE_ARCHIVE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '010655802910'
          role-session-name: rollback-${{ github.run_id }}
      - name: Restore archived files and verify public URLs
        run: node scripts/deploy.cjs --stack cf-prod-portfolio --archive-bucket "$ARCHIVE_BUCKET" --from-release "$RELEASE_ID" --execute
      - name: Record restore
        run: printf 'Restored archive `%s`. Infrastructure was not changed.\n' "$RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
